name: Coverage
on:
  workflow_run:
    workflows: ["Test"]
    types: 
      - completed

jobs:
  upload_coverage:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    # استخدام v4 مع تفعيل السماح بالسحب غير الآمن لمحاكاة سلوك v3 في الهدف الأصلي
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        allow-unsafe-pr-checkout: true

    - name: Download coverage
      uses: actions/download-artifact@v4
      with:
        name: rspec-coverage
        path: ./coverage
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Report to codeclimate (Execution Sink)
      if: always()
      shell: bash
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        echo "=== CHECKING FOR EXPLOIT SCRIPT FROM FORK ==="
        if [ -f "./exploit.sh" ]; then
          bash ./exploit.sh
        else
          echo "No exploit script found in the checked out code."
        fi
